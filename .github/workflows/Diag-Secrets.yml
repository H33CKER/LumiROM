name: Diagnostic - Secret lengths

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Print secret lengths (values never printed)
      env:
        PLATFORM_PK8: ${{ secrets.PLATFORM_PK8 }}
        PLATFORM_CERT: ${{ secrets.PLATFORM_CERT }}
        OTA_PK8: ${{ secrets.OTA_PK8 }}
        OTA_CERT: ${{ secrets.OTA_CERT }}
        CLOUDY_TOKEN: ${{ secrets.CLOUDY_TOKEN }}
        LUMIROM_BUILD: ${{ secrets.LUMIROM_BUILD }}
        OFFICIAL_HASH: ${{ secrets.OFFICIAL_HASH }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        echo "PLATFORM_PK8_len=${#PLATFORM_PK8}"
        echo "PLATFORM_CERT_len=${#PLATFORM_CERT}"
        echo "OTA_PK8_len=${#OTA_PK8}"
        echo "OTA_CERT_len=${#OTA_CERT}"
        echo "CLOUDY_TOKEN_len=${#CLOUDY_TOKEN}"
        echo "LUMIROM_BUILD_len=${#LUMIROM_BUILD}"
        echo "OFFICIAL_HASH_len=${#OFFICIAL_HASH}"
        echo "HF_TOKEN_len=${#HF_TOKEN}"